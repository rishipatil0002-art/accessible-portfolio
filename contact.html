<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav aria-label="Main Navigation">

            <h2>Task Manager</h2>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

        </nav>
    </header>


    <main>

        <section class="page-section">

            <h1>Contact Me</h1>

            <form class="contact-form">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Enter your message"
                    required
                ></textarea>


                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>


    <footer>
        <p>&copy; 2026 My Task Manager. All Rights Reserved.</p>
    </footer>

</body>
</html>
