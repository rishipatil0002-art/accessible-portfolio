<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Contact me through my portfolio for questions, opportunities or collaboration.">

    <title>Contact Me | My Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Skip link for keyboard accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header>

        <div class="header-content">
            <h1>Contact Me</h1>

            <!-- Light/Dark Theme Button -->
            <button id="theme-toggle"
                type="button"
                aria-label="Switch to dark theme">
                🌙
            </button>
        </div>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <main id="main-content">

        <section>

            <h2>Get In Touch</h2>

            <p>
                If you would like to contact me, please fill out the form below.
            </p>

        </section>

        <form aria-label="Contact form">

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>

        </form>

    </main>

    <footer>

        <p>
            &copy; 2026 My Portfolio
        </p>

    </footer>


    <!-- Theme Toggle JavaScript -->
    <script>
        const themeToggle = document.getElementById("theme-toggle");

        themeToggle.addEventListener("click", function () {

            document.body.classList.toggle("dark-theme");

            if (document.body.classList.contains("dark-theme")) {

                themeToggle.textContent = "☀️";

                themeToggle.setAttribute(
                    "aria-label",
                    "Switch to light theme"
                );

            } else {

                themeToggle.textContent = "🌙";

                themeToggle.setAttribute(
                    "aria-label",
                    "Switch to dark theme"
                );
            }
        });
    </script>

</body>

</html>
